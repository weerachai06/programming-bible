name: Parallel Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

env:
  PNPM_VERSION: '10.8.1'

jobs:
  prepare:
    name: Install & Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

  test:
    name: Unit Tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run tests
        run: pnpm test:run
        working-directory: ./nextjs

  lint:
    name: Linting
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run linter
        run: pnpm lint
        working-directory: ./nextjs

  typecheck:
    name: Type Checking
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run type checker
        run: pnpm jsdoc:check
        working-directory: ./nextjs

  e2e:
    name: E2E Tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./nextjs

      - name: Run E2E tests
        run: pnpm e2e
        working-directory: ./nextjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjs/playwright-report/
          retention-days: 7
