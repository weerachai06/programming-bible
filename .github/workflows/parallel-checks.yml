name: Parallel Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  prepare:
    name: Install & Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      store-path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './nextjs/.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./nextjs

  test:
    name: Unit Tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './nextjs/.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ needs.prepare.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./nextjs

      - name: Run tests
        run: pnpm test:run
        working-directory: ./nextjs

  lint:
    name: Linting
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './nextjs/.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ needs.prepare.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./nextjs

      - name: Run linter
        run: pnpm lint
        working-directory: ./nextjs

  typecheck:
    name: Type Checking
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './nextjs/.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ needs.prepare.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./nextjs

      - name: Run type checker
        run: pnpm jsdoc:check
        working-directory: ./nextjs
